[project]
name = "urbannoise"
version = "1.0.0"
description = "Human–machine collaborative urban noise predictive sampling and intelligent task allocation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyjwt>=2.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "scipy>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fpdf2>=2.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
where = ["src"]
